[build]
  base = "/"
  command = "node scripts/prepare-commercial-functions.cjs && yarn --cwd frontend install --non-interactive --frozen-lockfile && yarn --cwd frontend build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "24"
  GENERATE_SOURCEMAP = "false"

[functions]
  directory = "netlify/commercial-functions-build"

# Internal clinical endpoints are excluded from the commercial deployment.
[[redirects]]
  from = "/api/internal-clinical/*"
  to = "/api-unavailable.json"
  status = 404
  force = true

# The public training catalogue is intentionally unavailable until the
# separate professional/student access path is validated. Keep these
# anonymous legacy endpoints closed even though the function still contains
# authenticated course infrastructure for future work.
[[redirects]]
  from = "/api/courses/"
  to = "/api-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/api/courses/:course_id"
  to = "/api-unavailable.json"
  status = 404
  force = true

# Unknown /api routes must never receive the SPA index.html with HTTP 200.
# Netlify commercial functions remain served at /.netlify/functions/*.
[[redirects]]
  from = "/api"
  to = "/api-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/api-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

name: Internal Clinical CI

on:
  push:
    branches:
      - 'automation/web-internal-clinical-*'
      - 'automation/public-reconcile-*'
      - 'work/web-infra-v1-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: yarn install --non-interactive --frozen-lockfile
      - name: Build
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
        run: yarn build
      - name: Tests
        env:
          CI: 'true'
        run: yarn test --watchAll=false --passWithNoTests
      - name: Public commercial source and contact regression
        run: node --test tests/public-*.test.cjs
      - name: Browser E2E access and accessibility
        run: node e2e/browser-access.mjs
      - name: Browser E2E public route accessibility
        run: node e2e/browser-public-accessibility.mjs
      # The commercial build deliberately disables private clinical login.
      # Rebuild a separate, test-only bundle to exercise the authenticated UI
      # against the synthetic browser backend. This artifact is never deployed.
      - name: Build isolated clinical UI for mock-backed browser tests only
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_INTERNAL_PORTAL_ENABLED: 'true'
        run: yarn build
      - name: Browser E2E authenticated clinical flow (isolated test build)
        run: node e2e/browser-clinical.mjs

  backend-clinical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r backend/requirements.txt
      - name: Internal clinical and security tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q backend/tests/test_internal_*.py --junitxml=backend/internal-clinical-junit.xml
      - name: Preserve internal clinical diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-clinical-test-results
          path: backend/internal-clinical-junit.xml
          if-no-files-found: warn

  netlify-clinical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install Netlify function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck clinical function
        run: npx tsc --noEmit --allowImportingTsExtensions --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --types node functions/internal-clinical.mts
      - name: Typecheck personal inbox function
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --types node functions/internal-personal-inbox.mts
      - name: Typecheck public API function
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --types node functions/public-api.mts
      - name: Tenant isolation and security regression
        run: node --test tests/*.test.mjs

  netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Scan tracked files for committed secrets
        run: node scripts/secret-scan.mjs
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --non-interactive --frozen-lockfile
      - name: Install Netlify function dependencies
        run: npm --prefix netlify ci --ignore-scripts --no-audit --no-fund
      - name: Audit root runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit Netlify runtime dependencies
        run: npm --prefix netlify audit --omit=dev --audit-level=high
      - name: Build production artifact without deploy
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build
      - name: Prepare isolated commercial functions
        run: node scripts/prepare-commercial-functions.cjs
      - name: Verify commercial-only function package
        run: node --test scripts/commercial-package.test.cjs
      - name: Verify Aula function isolation
        run: node --test scripts/aula-package.test.cjs
      - name: Test Aula progression and synthetic preview endpoints
        run: node --test netlify/aula/access-policy.test.mjs netlify/aula/f3-policy.test.mjs netlify/aula/f5-policy.test.mjs netlify/aula/f6-policy.test.mjs netlify/aula/aula-demo.test.mjs
      - name: Netlify HTTP header smoke
        run: node scripts/netlify-http-smoke.mjs
      - name: Rehearse release artifact restore
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-rehearsal.mjs
      - name: Preserve release rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-infra-release-rehearsal-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error

  netlify-runtime-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gasi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: netlify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Netlify function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL Aula F1 and F2 integration
        env:
          GASI_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/gasi
        run: |
          node aula/migrate.mjs
          node aula/migrate.mjs
          psql "$GASI_INTEGRATION_DB_URL" -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM aula_schema_migrations" | grep -qx 5
          export GASI_AULA_DB_URL="$GASI_INTEGRATION_DB_URL"
          export AULA_BOOTSTRAP_CONFIRM="CREATE_FIRST_ADMIN"
          export AULA_BOOTSTRAP_EMAIL="bootstrap@example.invalid"
          export AULA_BOOTSTRAP_NAME="Administrador inicial de prueba"
          export AULA_BOOTSTRAP_PASSWORD="$(openssl rand -hex 24)"
          node aula/bootstrap-admin.mjs
          if node aula/bootstrap-admin.mjs > /dev/null 2>&1; then
            echo "ERROR: second administrator bootstrap unexpectedly succeeded"
            exit 1
          fi
          unset AULA_BOOTSTRAP_PASSWORD AULA_BOOTSTRAP_EMAIL AULA_BOOTSTRAP_NAME AULA_BOOTSTRAP_CONFIRM
          node --test aula/persistence-postgres.test.mjs aula/persistence-f3.test.mjs aula/persistence-f4.test.mjs aula/persistence-f5.test.mjs aula/persistence-f6.test.mjs
      - name: PostgreSQL attendance and recovery integration
        env:
          GASI_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/gasi
        run: node --test tests/runtime-postgres-integration.test.mjs
      - name: PostgreSQL personal inbox isolation integration
        env:
          GASI_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/gasi
        run: node --test tests/runtime-personal-inbox-postgres.test.mjs
      - name: PostgreSQL backup and restore rehearsal
        env:
          GASI_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/gasi
        run: node tests/postgres-backup-restore-rehearsal.mjs

  # GitHub's legacy status endpoint does not expose Actions check-runs. Publish
  # each completed job conclusion on the same preview commit for auditability.
  report-ci-statuses:
    if: ${{ always() && (github.ref == 'refs/heads/automation/public-reconcile-20261023' || github.ref == 'refs/heads/automation/public-reconcile-access-chat-20261107' || github.ref == 'refs/heads/automation/public-reconcile-aula-f1f2-20261107') }}
    needs: [frontend, netlify-build, backend-clinical, netlify-clinical, netlify-runtime-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Record verified job conclusions on this preview commit
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          results = json.loads(os.environ['CI_RESULTS'])
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          endpoint = f'https://api.github.com/repos/{repository}/statuses/{sha}'
          states = {'success': 'success', 'failure': 'failure', 'cancelled': 'error', 'skipped': 'error'}
          for name, job in results.items():
              conclusion = job['result']
              state = states.get(conclusion, 'error')
              payload = json.dumps({
                  'state': state,
                  'context': f'gasi-ci/{name}',
                  'description': f'GitHub Actions job {name}: {conclusion}'[:140],
                  'target_url': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              }).encode('utf-8')
              request = Request(endpoint, data=payload, method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urlopen(request, timeout=20) as response:
                  if response.status != 201:
                      raise RuntimeError(f'Failed to report {name}: HTTP {response.status}')
              print(f'{name}: {conclusion}')
          PY

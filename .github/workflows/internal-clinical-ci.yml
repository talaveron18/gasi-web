name: Internal Clinical CI

on:
  push:
    branches:
      - 'automation/web-internal-clinical-*'
      - 'work/web-infra-v1-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: yarn install --non-interactive --frozen-lockfile
      - name: Build
        env:
          CI: 'true'
        run: yarn build
      - name: Tests
        env:
          CI: 'true'
        run: yarn test --watchAll=false --passWithNoTests
      - name: Browser E2E access and accessibility
        run: node e2e/browser-access.mjs

  backend-clinical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install fastapi starlette pydantic python-dotenv motor pytest pytest-asyncio httpx
      - name: Internal clinical and security tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q backend/tests/test_internal_*.py --junitxml=backend/internal-clinical-junit.xml
      - name: Preserve internal clinical diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-clinical-test-results
          path: backend/internal-clinical-junit.xml
          if-no-files-found: warn

  netlify-clinical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install Netlify function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck clinical function
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --types node functions/internal-clinical.mts
      - name: Tenant isolation and security regression
        run: node --test tests/*.test.mjs

  netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --non-interactive --frozen-lockfile
      - name: Install Netlify function dependencies
        run: npm --prefix netlify ci --ignore-scripts --no-audit --no-fund
      - name: Run Netlify production build
        env:
          CI: 'false'
        run: npx -y netlify-cli@27.8.0 build --offline
      - name: Rehearse release artifact restore
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-rehearsal.mjs
      - name: Preserve release rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-infra-release-rehearsal-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error

  netlify-runtime-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gasi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: netlify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install Netlify function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL attendance and recovery integration
        env:
          GASI_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/gasi
        run: node --test tests/runtime-postgres-integration.test.mjs

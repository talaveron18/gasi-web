name: Internal Clinical CI
on:
  push:
    branches: ['automation/web-internal-clinical-*','work/web-infra-v1-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-runtime-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore runtime suite and harden DB failure boundary
        run: |
          git show 108a478658953c2afc28024a18e9d43badc07a0b:netlify/tests/runtime-postgres-integration.test.mjs > netlify/tests/runtime-postgres-integration.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/tests/runtime-postgres-integration.test.mjs')
          s=p.read_text()
          old=''' res=await handler(request("/api/internal-clinical/health"),{});\n assert.equal(res.status,500);\n assert.deepEqual(await responseJson(res),{detail:"internal_error"});\n secrets.NETLIFY_DB_URL=workingDbUrl;'''
          new=''' res=await handler(request("/api/internal-clinical/health"),{});\n assert.equal(res.status,500);\n assert.deepEqual(await responseJson(res),{detail:"internal_error"});\n assert.match(res.headers.get("x-request-id")||"",/^[0-9a-f-]{36}$/i);\n assert.match(res.headers.get("server-timing")||"",/^app;dur=\\d+$/);\n assert.equal(res.headers.get("content-type"),"application/json");\n secrets.NETLIFY_DB_URL=workingDbUrl;'''
          if old not in s: raise SystemExit('failure-boundary block missing')
          p.write_text(s.replace(old,new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/tests/runtime-postgres-integration.test.mjs
          git commit -m 'test: restore and harden clinical runtime suite'
          git push

name: Netlify DB Diagnostic Deploy

on:
  push:
    branches:
      - 'diag/netlify-db-provision-20260918'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[db-diag-relay]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          ref: diag/netlify-db-provision-20260918
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Create ephemeral relay key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:8192 -out /tmp/relay-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/relay-private.pem -pubout -out /tmp/relay-public.pem
          PUB="$(base64 -w0 /tmp/relay-public.pem)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/30/comments" -f body="DB_DIAG_PUBLIC_KEY_${GITHUB_RUN_ID}:${PUB}" >/dev/null
      - name: Await encrypted deploy capability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAYLOAD=""
          for i in $(seq 1 180); do
            PAYLOAD="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/30/comments" --jq '.[].body' | sed -n "s/^DB_DIAG_CIPHERTEXT_${GITHUB_RUN_ID}://p" | tail -n 1)"
            if [ -n "${PAYLOAD}" ]; then break; fi
            sleep 5
          done
          test -n "${PAYLOAD}"
          printf '%s' "${PAYLOAD}" | base64 -d > /tmp/relay-cipher.bin
          PROXY_PATH="$(openssl pkeyutl -decrypt -inkey /tmp/relay-private.pem -in /tmp/relay-cipher.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)"
          case "${PROXY_PATH}" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) exit 1 ;;
          esac
          npx -y @netlify/mcp@latest --site-id c8108df3-f7c4-4027-89ac-574326399123 --proxy-path "${PROXY_PATH}"

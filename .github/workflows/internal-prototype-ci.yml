name: Internal Prototype CI

on:
  push:
    branches:
      - 'automation/web-internal-clinical-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Build
        env:
          CI: 'true'
        run: yarn build
      - name: Tests
        env:
          CI: 'true'
        run: yarn test --watchAll=false --passWithNoTests

  backend-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: pip install fastapi starlette pydantic python-dotenv motor pytest httpx
      - name: Internal synthetic and security tests
        env:
          ENABLE_INTERNAL_SYNTHETIC_PROTOTYPE: 'true'
        run: pytest -q tests/test_internal_*.py --junitxml=internal-prototype-junit.xml
      - name: Preserve internal prototype diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-prototype-test-results
          path: backend/internal-prototype-junit.xml
          if-no-files-found: warn

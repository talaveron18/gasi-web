name: Verify live GASI V1

on:
  push:
    branches:
      - 'ops/public-frontend-v1-20260921'

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-live-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live public and clinical proxy
        run: |
          set -euo pipefail
          SITE="https://gasisalud.com"
          CLINICAL="https://gasi-clinical.netlify.app"
          check() {
            local name="$1"; shift
            local expected="$1"; shift
            local status
            status="$(curl -sS -D "/tmp/\${name}.headers" -o "/tmp/\${name}.body" -w '%{http_code}' "$@")"
            echo "\${name}: \${status} (expected \${expected})"
            echo "\${name}_body=$(cat /tmp/\${name}.body)"
            test "\${status}" = "\${expected}"
          }

          check home 200 "\${SITE}/"
          check clinical_health 200 "\${SITE}/api/internal-clinical/health"
          check clinical_session 401 "\${SITE}/api/internal-clinical/session"

          payload='{"worker_id":"GASI-MASTER-01","recovery_secret":"invalid-negative-only","new_password":"NegativeOnly-Test-Password-123!"}'

          check direct_master_wrong_code 401 -X POST \
            -H 'Content-Type: application/json' \
            --data "\${payload}" \
            "\${CLINICAL}/api/internal-clinical/master-recovery"
          grep -q '"detail":"invalid_recovery_credentials"' /tmp/direct_master_wrong_code.body

          public_status="$(curl -sS -D /tmp/public_master_wrong_code.headers -o /tmp/public_master_wrong_code.body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "\${payload}" \
            "\${SITE}/api/internal-clinical/master-recovery")"
          echo "public_master_wrong_code: \${public_status}"
          echo "public_master_wrong_code_body=$(cat /tmp/public_master_wrong_code.body)"
          case "\${public_status}" in
            400|401) ;;
            *) exit 1 ;;
          esac

          echo "LIVE_MASTER_RECOVERY_DIAGNOSTIC=PASS"

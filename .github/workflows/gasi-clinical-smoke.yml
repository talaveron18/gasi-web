name: GASI Clinical Smoke

on:
  push:
    branches:
      - 'ops/netlify-deploy-relay-20260918'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Netlify runtime
        run: curl --fail --silent --show-error https://deploy-preview-32--gasi-clinical.netlify.app/api/_diag/ping
      - name: Verify Netlify Database
        run: curl --silent --show-error --include https://deploy-preview-32--gasi-clinical.netlify.app/api/_diag/db
      - name: Verify bcrypt runtime
        run: curl --silent --show-error --include https://deploy-preview-32--gasi-clinical.netlify.app/api/_diag/bcrypt
      - name: Verify clinical health
        run: curl --silent --show-error --include https://deploy-preview-32--gasi-clinical.netlify.app/api/internal-clinical/health

name: GASI Clinical Smoke

on:
  push:
    branches:
      - 'ops/netlify-deploy-relay-20260918'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify clinical health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://deploy-preview-32--gasi-clinical.netlify.app/api/internal-clinical/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"storage":"netlify-database"'

name: Diagnose public V1 build

on:
  push:
    branches:
      - 'ops/public-build-diagnose-20260920'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a397bdd689f3b2b92910041b1c35ffe68580ca0b
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Prepare public profile
        run: |
          set -euo pipefail
          rm -f netlify/functions/internal-clinical.mts
          find netlify/database/migrations -mindepth 1 -maxdepth 1 -type d ! -name '20260920190000_public-web-v1' -exec rm -rf {} +
      - name: Root dependency install
        run: npm ci
      - name: Frontend dependency install
        run: yarn --cwd frontend install --non-interactive --frozen-lockfile
      - name: Frontend production build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
        run: yarn --cwd frontend build
      - name: Typecheck Netlify functions
        run: |
          npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --types node netlify/functions/public-api.mts netlify/functions/chatbot.js netlify/functions/contact.js || true
      - name: Inspect profile
        run: |
          set -euo pipefail
          test -f frontend/build/index.html
          test -f netlify/functions/public-api.mts
          test ! -f netlify/functions/internal-clinical.mts
          find netlify/database/migrations -maxdepth 2 -type f -print
